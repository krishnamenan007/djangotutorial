version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: djangotutorial_postgres
    environment:
      POSTGRES_DB: djangotutorial
      POSTGRES_USER: django_user
      POSTGRES_PASSWORD: django_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U django_user -d djangotutorial"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
