version: '3.8'

services:
  web:
    build: .
    container_name: djangotutorial_web
    command: gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 myfirstsite.wsgi:application
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DB_NAME=djangotutorial
      - DB_USER=django_user
      - DB_PASSWORD=django_password
      - DB_HOST=postgres
      - DB_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    container_name: djangotutorial_postgres
    environment:
      POSTGRES_DB: djangotutorial
      POSTGRES_USER: django_user
      POSTGRES_PASSWORD: django_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U django_user -d djangotutorial"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
